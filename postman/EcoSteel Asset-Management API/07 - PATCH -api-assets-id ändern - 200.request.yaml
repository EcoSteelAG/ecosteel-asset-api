$kind: http-request
name: 07 - PATCH /api/assets/:id ändern -> 200
url: "{{baseUrl}}/api/assets/{{assetId}}"
method: PATCH
headers:
  x-api-key: "{{apiKey}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "status": "wartung"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Status wurde geändert', () => pm.expect(pm.response.json().status).to.eql('wartung'));
order: 7000
