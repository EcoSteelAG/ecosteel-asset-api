url: "{{baseUrl}}/api/assets"
method: POST
headers:
  x-api-key: "{{apiKey}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "",
      "status": "kaputt"
    }
scripts:
